project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.ipynb"
    - "!CLAUDE.md"
  resources:
    - "site.webmanifest"
  post-render:
    - "python generate-llms-txt.py"
    - "python generate-ai-links.py"
    - "python generate-structured-data.py"
    - "python fix-sitemap-urls.py"

website:
  title: "Matt Hodges"
  description: "Matt Hodges is a political technologist and founder of Ilium Strategies, a consulting practice helping Democrats build, scale, and innovate with technology and AI. Former Director of Engineering for Biden 2020. Featured in The New York Times, Wired, The Washington Post, and The Economist."
  image: "img/social.jpg"
  favicon: "img/favicon.svg"
  twitter-card: true
  site-url: https://matthodges.com
  open-graph: true
  page-footer: |
     Copyright 2026, Matt Hodges
  navbar:
    right:
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/hodgesmr
        target: _blank
      - text: "GitHub"
        href: https://github.com/hodgesmr
        target: _blank 
      - text: "Posts"
        href: posts.qmd
      - text: "RSS"
        href: posts.xml
      - text: "llms.txt"
        href: llms.txt
  search: 
    location: navbar
    type: overlay

format:
  html:
    theme:
      - cosmo
      - styles.scss
    header-includes: |
      <link rel="manifest" href="/site.webmanifest">
      <meta name="theme-color" content="#FFFFFF">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
    mainfont: Inter
    monofont: DM Mono
    fontsize: 1rem
    grid:
      body-width: 800px
    toc: true
    link-external-newwindow: true
    title-prefix: ""
    fig-responsive: true
    fig-format: svg
  gfm:
    output-ext: md
    preview-mode: raw
    fig-format: svg
language: 
  search-box-placeholder: "Search"
  related-formats-title: "For LLMs:"
canonical-url: true